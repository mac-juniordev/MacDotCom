<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0a" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Outer rotating ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="10 5"/>
  
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 5"/>
  
  <!-- The "M" letter - corrected orientation -->
  <g transform="translate(50, 50) scale(0.6, -0.6)">
    <!-- Main M shape -->
    <path d="M -30 20 L -30 -20 L -15 -20 L -15 5 L 0 -15 L 15 5 L 15 -20 L 30 -20 L 30 20 L 15 20 L 0 0 L -15 20 Z" 
          fill="#3b82f6"/>
    
    <!-- Accent line -->
    <path d="M -30 20 L -15 5 L 0 -15 L 15 5 L 30 20" 
          fill="none" stroke="#10b981" stroke-width="2"/>
  </g>
  
  <!-- Small dot -->
  <circle cx="50" cy="50" r="3" fill="#f59e0b"/>
</svg>